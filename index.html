<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7eee7"><meta name="description" content="Пространство психологической поддержки Елены Осинцевой">
<link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg">
<title>Можно быть собой — Елена Осинцева</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap');
:root{--ink:#45352e;--muted:#987e70;--cream:#fbf6f1;--line:#e8d7cb;--rose:#eab99f;--blue:#7394a8}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#f7eee8,#fbf6f1 55%,#f1e5dc);color:var(--ink);font-family:'DM Sans',sans-serif}.app{max-width:520px;margin:auto;padding:0 17px 100px;min-height:100vh}.top{height:76px;display:flex;align-items:center;gap:11px;margin-bottom:17px}.mark{width:43px;height:43px;border-radius:50%;background:#e9d9d0;border:1px solid #dfc4b4;display:grid;place-items:center;color:#895d4c;font-size:25px}.brand{flex:1}.brand b{display:block;font-size:15px}.brand small{color:#9a8376;font-size:10px}.bell{width:39px;height:39px;border-radius:50%;border:1px solid #d9c4b7;background:#fff8f2;color:#886b5c;font-size:19px}
.hero{height:445px;border-radius:27px;overflow:hidden;position:relative;background:#7894a2;box-shadow:0 14px 34px #8c68521c}.hero img{width:100%;height:100%;object-fit:cover;object-position:center 35%}.shade{position:absolute;inset:0;background:linear-gradient(90deg,#1e3a50c9 0%,#29465d80 42%,#29465d05 100%),linear-gradient(0deg,#263b4b50,transparent 55%)}.heroText{position:absolute;inset:0;padding:27px 23px;color:white;display:flex;align-items:flex-start;flex-direction:column}.eyebrow{font-size:9px;letter-spacing:1.5px;font-weight:700;color:#a87964}.hero .eyebrow{color:#f8e3d8}.hero h1{font:500 47px/1.02 'Playfair Display',serif;margin:25px 0 12px}.hero p{font-size:12px;line-height:1.55;max-width:205px;margin:0 0 16px;color:#fff8f2}.hero .btn{margin-top:2px}.btn{border:0;border-radius:30px;padding:14px 19px;background:linear-gradient(135deg,#f4cbb7,#eaa98e);color:#573b30;font-weight:700;font-size:13px;box-shadow:0 6px 16px #80533b22}.btn:disabled{opacity:.5}
.sectionHead{display:flex;justify-content:space-between;align-items:end;margin:24px 2px 13px}.sectionHead h2{font:500 22px 'Playfair Display',serif;margin:5px 0 0}.sectionHead small{font-size:10px;color:#9b8273}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tile{position:relative;text-align:left;border:1px solid #d8c8bc;background:linear-gradient(145deg,#fffdfa,#f8eee7);border-radius:19px;padding:14px 12px;min-height:116px;color:#4b3b33;box-shadow:0 6px 18px #795b4810;display:flex;flex-direction:column;justify-content:center}.tile .ico{font-size:26px;display:block;margin-bottom:7px;color:#a8735d}.tile b{display:block;font-size:12px;line-height:1.25}.tile small{display:block;font-size:9px;line-height:1.35;color:#9a8578;margin-top:4px}.tagline{font:italic 29px 'Playfair Display',serif;text-align:center;color:#76594b;margin:24px 0 14px}.sunset{height:125px;border-radius:18px;overflow:hidden;position:relative;background:linear-gradient(180deg,#f6d9c5,#edb994 48%,#9a897f);margin-bottom:16px}.sunset:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 70%,#fff3ce 0 7%,transparent 30%),linear-gradient(0deg,#4d5e5b80,transparent 60%)}.sunset:after{content:"";position:absolute;bottom:-30px;left:-5%;width:110%;height:75px;background:#68776c;border-radius:50% 50% 0 0;filter:blur(5px)}.quote{background:#f2e4da;border:1px solid #ead8cc;border-radius:18px;padding:16px 18px;margin:14px 0}.quote p{font:16px/1.4 'Playfair Display',serif;color:#654c40;margin:3px 0 8px}.quote small{font-size:9px;color:#987c6d}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(520px,100%);display:flex;justify-content:space-around;background:#fffaf6ed;backdrop-filter:blur(18px);border-top:1px solid #e8d9ce;padding:10px 4px calc(10px + env(safe-area-inset-bottom));z-index:5;box-shadow:0 -7px 24px #6b49300b}.nav button{border:0;background:none;color:#9c8678;font-size:9px;padding:5px 8px;display:grid;gap:4px;justify-items:center;min-width:58px}.nav button.active{color:#8d5d4a;background:#f3e5dc;border-radius:13px}.nav i{font-style:normal;font-size:20px}
.page{padding:5px 0}.back{border:0;background:none;color:#987b6b;padding:8px 0 20px;font-size:11px}.page h1{font:500 39px/1.05 'Playfair Display',serif;color:#59443a;margin:12px 0}.intro{font-size:12px;line-height:1.65;color:#8b766a;margin:0 0 20px}.card{background:linear-gradient(145deg,#fffdfa,#fbf3ed);border:1px solid #eadbd1;border-radius:18px;padding:15px;margin:10px 0;box-shadow:0 5px 16px #795b4809}.card h3{font:20px 'Playfair Display',serif;margin:0 0 8px}.card p{font-size:12px;line-height:1.6;color:#806d61}.practice{width:100%;display:flex;align-items:center;gap:12px;text-align:left;color:#57453a}.practice strong{font-size:12px}.practice small{display:block;color:#9b8578;font-size:10px;margin-top:5px}.moods{display:flex;justify-content:space-between;gap:4px;margin:12px 0 20px}.moods button{flex:1;border:1px solid transparent;border-radius:12px;padding:9px 2px;background:#f8f0eb;font-size:9px;color:#806d61}.moods button.sel{border-color:#d5a48d;background:#f5e2d7}textarea,input{font:12px 'DM Sans';border:1px solid #e8d8cd;border-radius:12px;padding:12px;width:100%;background:#fffdfb;color:#59473e}textarea{min-height:100px;resize:vertical}.chatlog{display:flex;flex-direction:column;gap:9px;margin:15px 0}.bubble{max-width:90%;padding:12px 14px;border-radius:15px;background:#fff;border:1px solid #ecded4;font-size:12px;line-height:1.6}.bubble.user{align-self:flex-end;background:#ead5c8}.profile img{width:100%;height:250px;object-fit:cover;object-position:center 38%;border-radius:20px}.profile h1{margin-top:15px}.links button{display:block;width:100%;padding:12px;margin-top:7px;border:1px solid #eadbd1;border-radius:12px;background:#fff;color:#765746;text-align:left}.muted{font-size:10px;color:#9a8578;line-height:1.5}.scenic{height:110px;border-radius:14px;background:linear-gradient(180deg,#f6d7b7,#e5b18d 55%,#7d8b7c);margin:8px 0;display:flex;align-items:end;padding:10px;color:white;font-size:12px;font-weight:600;text-shadow:0 1px 4px #333}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;text-align:center;font-size:10px}.calendar span{padding:7px 0;border-radius:9px;background:#f8eee7}.calendar .today{background:#dba78e;color:white}
@media(max-width:370px){.hero{height:420px}.hero h1{font-size:42px}.tile{min-height:108px;padding:12px 10px}.tile b{font-size:11px}}
</style></head>
<body><div class="app">
<header class="top"><div class="mark">♡</div><div class="brand"><b>Елена Осинцева</b><small>психолог · поддержка · развитие</small></div><button class="bell" aria-label="Уведомления">♧</button></header>
<main id="view"></main></div>
<nav class="nav"><button data-tab="home" class="active"><i>⌂</i>Главная</button><button data-tab="practices"><i>❀</i>Практики</button><button data-tab="journal"><i>▤</i>Дневник</button><button data-tab="chat"><i>•••</i>Чат</button><button data-tab="profile"><i>○</i>Профиль</button></nav>
<script>
const view=document.getElementById('view');let tab='home',mood='',chat=[['assistant','Здравствуйте. Я бережный цифровой помощник пространства Елены. Могу помочь подобрать практику и спокойно разобраться, что сейчас происходит. С чего вам хотелось бы начать?']];
const practices=[['Дыхание спокойствия','Снять напряжение и немного замедлиться','7 минут','Сядьте удобно. Сделайте мягкий вдох и чуть более длинный выдох. Не старайтесь дышать глубоко или идеально — просто найдите комфортный ритм.'],['Внутренняя опора','Вспомнить свои ресурсы и сильные стороны','10 минут','Вспомните момент, когда вы справились с непростой ситуацией. Что помогло вам тогда? Какие качества и люди поддерживали вас?'],['Границы без вины','Услышать свои желания и обозначить границы','12 минут','Подумайте, где вам хотелось бы сказать «нет» или попросить о другом. Сформулируйте одну доброжелательную фразу о своей потребности.']];
function home(){return `<section class="hero"><img src="./images/elena-osintseva.jpg" alt="Елена Осинцева"><div class="shade"></div><div class="heroText"><span class="eyebrow">ПРОСТРАНСТВО ДЛЯ ПОДДЕРЖКИ, РАЗВИТИЯ И ВНУТРЕННЕЙ ОПОРЫ</span><h1>Можно быть<br><em>собой.</em></h1><p>Место, где можно остановиться, услышать себя и найти внутреннюю опору.</p><button class="btn" onclick="go('chat')">☏ &nbsp; Задать вопрос Елене</button></div></section><div class="sectionHead"><div><span class="eyebrow">ВАШ МАЛЕНЬКИЙ ШАГ</span><h2>С чего начнём сегодня?</h2></div><small>${new Date().toLocaleDateString('ru-RU',{day:'numeric',month:'long'})}</small></div><div class="grid">
<button class="tile" onclick="go('chat')"><span class="ico">♡</span><b>Поддержка сейчас</b><small>Когда тревожно, грустно или сложно</small></button>
<button class="tile" onclick="go('practices')"><span class="ico">❀</span><b>Практики и упражнения</b><small>Дыхание, ресурс, эмоции, самооценка</small></button>
<button class="tile" onclick="go('journal')"><span class="ico">▤</span><b>Дневник чувств</b><small>Замечать и отслеживать изменения</small></button>
<button class="tile" onclick="go('profile')"><span class="ico">▦</span><b>Запись к Елене</b><small>Консультации, форматы, расписание</small></button>
<button class="tile" onclick="go('journal')"><span class="ico">♧</span><b>Мой путь</b><small>Цели, привычки, достижения</small></button>
<button class="tile" onclick="go('chat')"><span class="ico">✧</span><b>ИИ-помощник</b><small>Бережный диалог и практики</small></button>
</div><div class="tagline">Можно быть собой ♡</div><div class="sunset"></div><div class="quote"><p>«Не обязательно иметь все ответы прямо сейчас. Иногда достаточно сделать один бережный шаг».</p><small>Пространство Елены Осинцевой</small></div>`}
function head(title,desc){return `<button class="back" onclick="go('home')">← На главную</button><span class="eyebrow">ПРОСТРАНСТВО ЗАБОТЫ О СЕБЕ</span><h1>${title}</h1><p class="intro">${desc}</p>`}
function practicesPage(){return head('Практики<br><em>для себя</em>','Выберите то, что сейчас откликается. Можно идти в своём темпе и остановиться в любой момент.')+practices.map((p,i)=>`<button class="card practice" onclick="practice(${i})"><span style="font-size:23px;color:#a87560">❀</span><span><strong>${p[0]}</strong><small>${p[1]} · ${p[2]}</small></span>›</button>`).join('')}
function journalPage(){
let entries=JSON.parse(localStorage.getItem('elena-journal')||'[]');
const now=new Date(), year=now.getFullYear(), month=now.getMonth();
const firstDay=(new Date(year,month,1).getDay()+6)%7;
const daysInMonth=new Date(year,month+1,0).getDate();
const monthTitle=new Intl.DateTimeFormat('ru-RU',{month:'long',year:'numeric'}).format(now);
const calendarCells=Array.from({length:firstDay},()=>'<span class="empty"></span>').join('')+
Array.from({length:daysInMonth},(_,i)=>{const day=i+1;return `<span class="${day===now.getDate()?'today':''}">${day}</span>`}).join('');
return head('Дневник<br><em>чувств</em>','Здесь не нужно быть правильным. Можно честно отметить то, что происходит внутри.')+`<div class="card"><h3>${monthTitle}</h3><div class="calendar">${['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].map(x=>`<b>${x}</b>`).join('')}${calendarCells}</div></div><div class="card"><b style="font-size:12px">Как вы себя чувствуете сегодня?</b><div class="moods">${['тяжело','не очень','нормально','хорошо','прекрасно'].map((m,i)=>`<button class="${mood===m?'sel':''}" onclick="pickMood('${m}')">${['☹','◔','○','☺','♡'][i]}<br>${m}</button>`).join('')}</div><b style="font-size:12px">Записать мысли, чувства, инсайты…</b><textarea id="note" placeholder="Несколько слов о себе…"></textarea><button class="btn" style="width:100%;margin-top:12px" onclick="saveNote()">Сохранить запись</button><p class="muted">Записи демоверсии хранятся локально на этом устройстве.</p></div><h3 style="font:20px 'Playfair Display'">Мои заметки</h3>${entries.reverse().map(e=>`<div class="card"><b>${e.mood}</b><p>${e.note||'Без дополнительной заметки'}</p><small class="muted">${new Date(e.date).toLocaleString('ru-RU')}</small></div>`).join('')||'<p class="muted">Ваши заметки будут появляться здесь.</p>'}
}function chatPage(){return head('Рядом,<br><em>чтобы услышать</em>','Можно начать с любого вопроса. Вы сами решаете, чем делиться и когда остановиться.')+`<div class="card muted">Это демонстрационный помощник. Он не заменяет консультацию психолога и не предназначен для кризисной помощи.</div><div class="chatlog" id="chatlog">${chat.map(m=>`<div class="bubble ${m[0]==='user'?'user':''}">${esc(m[1])}</div>`).join('')}</div><div style="display:flex;gap:7px"><input id="chatinput" placeholder="Напишите, что сейчас важно…" onkeydown="if(event.key==='Enter')sendChat()"><button class="btn" onclick="sendChat()">➤</button></div><p class="muted">При непосредственной опасности обратитесь в местную экстренную службу или к человеку, который может помочь прямо сейчас.</p>`}
function profilePage(){return head('Елена<br><em>Осинцева</em>','Психолог · поддержка · развитие')+`<div class="profile"><img src="./images/elena-osintseva.jpg" alt="Елена Осинцева"></div><div class="card"><h3>О консультациях</h3><p>Здесь разместим согласованную с Еленой информацию о её подходе, направлениях работы и форматах консультаций.</p><p class="muted">Контакты мессенджеров подключим после получения ссылок Елены.</p></div><div class="card links"><h3>Связаться с Еленой</h3><button disabled>MAX — скоро</button><button disabled>Telegram — скоро</button><button disabled>WhatsApp — скоро</button></div>`}
function render(){view.innerHTML=tab==='home'?home():tab==='practices'?practicesPage():tab==='journal'?journalPage():tab==='chat'?chatPage():profilePage();document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab))}
function go(t){tab=t;render();window.scrollTo(0,0)}
document.querySelectorAll('.nav button').forEach(b=>b.addEventListener('click',()=>go(b.dataset.tab)));
function practice(i){let p=practices[i];view.innerHTML=head(p[0],p[1]+' · '+p[2])+`<div class="scenic">Найдите время для себя</div><div class="card"><p>${p[3]}</p><button class="btn" onclick="go('practices')">Я попробую</button></div>`}
function pickMood(m){mood=m;render()}
function saveNote(){if(!mood){alert('Сначала выберите настроение.');return}let a=JSON.parse(localStorage.getItem('elena-journal')||'[]');a.push({mood,note:document.getElementById('note').value,date:new Date().toISOString()});localStorage.setItem('elena-journal',JSON.stringify(a));mood='';render()}
function sendChat(){let el=document.getElementById('chatinput'),v=el.value.trim();if(!v)return;chat.push(['user',v],['assistant','Спасибо, что поделились. Давайте не будем торопиться с выводами. Что сейчас для вас самое важное в этой ситуации? Я могу предложить короткую практику. Я — демонстрационный помощник и не заменяю профессиональную помощь.']);render()}
function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
render();if('serviceWorker'in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))}
</script></body></html>
