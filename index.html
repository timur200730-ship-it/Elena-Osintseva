<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7eee7"><meta name="description" content="Пространство психологической поддержки Елены Осинцевой">
<link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg">
<title>Можно быть собой — Елена Осинцева</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap');
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 15% 5%,#fffaf6 0%,transparent 38%),linear-gradient(145deg,#f5e9e0 0%,#fbf6f1 48%,#efe0d5 100%);color:#493a33;font-family:'DM Sans',sans-serif}.app{max-width:520px;margin:auto;padding:0 17px 100px}.top{height:72px;display:flex;align-items:center;gap:11px;border-bottom:1px solid #eadbd1;margin-bottom:18px}.mark{width:40px;height:40px;border-radius:50%;background:#edd5c8;display:grid;place-items:center;color:#895d4c;font-size:22px}.brand{flex:1}.brand b{display:block;font-size:15px}.brand small{color:#9a8376;font-size:11px}.hero{height:455px;border-radius:29px;overflow:hidden;position:relative;background:#7894a2;box-shadow:0 14px 34px #8c68521c;border:1px solid #ffffffa6}.hero img{width:100%;height:100%;object-fit:cover;object-position:center 38%}.shade{position:absolute;inset:0;background:linear-gradient(90deg,#29465dba 0%,#29465d70 45%,#29465d05 100%),linear-gradient(0deg,#263b4b40,transparent 55%)}.heroText{position:absolute;inset:0;padding:29px 25px;color:white;display:flex;align-items:flex-start;flex-direction:column}.eyebrow{font-size:9px;letter-spacing:1.5px;font-weight:bold;color:#ad806c}.hero .eyebrow{color:#f7dfd2}.hero h1,.page h1{font:500 51px/1 'Playfair Display',serif;margin:27px 0 14px}.hero p{font-size:13px;line-height:1.6;max-width:220px}.btn{border:0;border-radius:28px;padding:13px 18px;background:linear-gradient(135deg,#f3c9b3,#e9a98e);color:#573b30;font-weight:700;font-size:13px}.sectionHead{display:flex;justify-content:space-between;align-items:end;margin:26px 2px 13px}.sectionHead h2{font:500 22px 'Playfair Display',serif;margin:5px 0}.sectionHead small{font-size:10px;color:#9b8273}.grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}.tile{position:relative;text-align:left;border:1px solid #eadbd1;background:linear-gradient(145deg,#fffdfa,#f9eee7);border-radius:20px;padding:16px 14px;min-height:125px;color:#4b3b33;box-shadow:0 6px 18px #795b4810}.tile .ico{font-size:25px;display:block;margin-bottom:10px;color:#a8735d}.tile b{display:block;font-size:12px}.tile small{display:block;font-size:10px;line-height:1.4;color:#9a8578;margin-top:5px}.quote{background:linear-gradient(135deg,#f2e4da,#f8eee8);border:1px solid #ead8cc;border-radius:20px;padding:19px;margin:17px 0}.quote p{font:17px/1.4 'Playfair Display',serif;color:#654c40;margin:5px 0 9px}.quote small{font-size:9px;color:#987c6d}.banner{width:100%;padding:15px;border-radius:17px;border:1px solid #e6c7b5;background:#fff8f2;text-align:left;color:#755344}.banner b,.banner small{display:block}.banner small{font-size:10px;color:#987f70;margin-top:4px}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(520px,100%);display:flex;justify-content:space-around;background:#fffaf6ed;backdrop-filter:blur(18px);border-top:1px solid #e8d9ce;padding:11px 5px calc(11px + env(safe-area-inset-bottom));z-index:5;box-shadow:0 -7px 24px #6b49300b}.nav button{border:0;background:none;color:#9c8678;font-size:9px;padding:5px;display:grid;gap:4px;justify-items:center}.nav button.active{color:#8d5d4a;background:#f3e5dc;border-radius:12px}.nav i{font-style:normal;font-size:19px}.page{padding:5px 0}.back{border:0;background:none;color:#987b6b;padding:8px 0 22px}.page h1{font-size:42px;color:#59443a;margin:12px 0}.intro{font-size:13px;line-height:1.65;color:#8b766a;margin:0 0 20px}.card{background:linear-gradient(145deg,#fffdfa,#fbf3ed);border:1px solid #eadbd1;border-radius:19px;padding:16px;margin:10px 0;box-shadow:0 5px 16px #795b4809}.card h3{font:20px 'Playfair Display',serif;margin:0 0 8px}.card p{font-size:12px;line-height:1.6;color:#806d61}.practice{width:100%;display:flex;align-items:center;gap:12px;text-align:left;color:#57453a}.practice strong{font-size:12px}.practice small{display:block;color:#9b8578;font-size:10px;margin-top:5px}.moods{display:flex;justify-content:space-between;gap:4px;margin:12px 0 20px}.moods button{flex:1;border:1px solid transparent;border-radius:12px;padding:9px 2px;background:#f8f0eb;font-size:9px;color:#806d61}.moods button.sel{border-color:#d5a48d;background:#f5e2d7}textarea,input{font:12px 'DM Sans';border:1px solid #e8d8cd;border-radius:12px;padding:12px;width:100%;background:#fffdfb;color:#59473e}textarea{min-height:100px;resize:vertical}.chatlog{display:flex;flex-direction:column;gap:9px;margin:15px 0}.bubble{max-width:90%;padding:12px 14px;border-radius:15px;background:#fff;border:1px solid #ecded4;font-size:12px;line-height:1.6}.bubble.user{align-self:flex-end;background:#ead5c8}.muted{font-size:10px;color:#9a8578;line-height:1.5}.profile img{width:100%;height:250px;object-fit:cover;object-position:center 38%;border-radius:20px}.profile h1{margin-top:15px}.links button{display:block;width:100%;padding:12px;margin-top:7px;border:1px solid #eadbd1;border-radius:12px;background:#fff;color:#765746;text-align:left}.hidden{display:none!important}
</style>
</head>
<body><div class="app">
<header class="top"><div class="mark">♡</div><div class="brand"><b>Можно быть собой</b><small>Елена Осинцева · психолог</small></div><span>☼</span></header>
<main id="view"></main></div>
<nav class="nav">
<button data-tab="home" class="active"><i>⌂</i>Главная</button><button data-tab="practices"><i>❀</i>Практики</button><button data-tab="journal"><i>♡</i>Дневник</button><button data-tab="chat"><i>✧</i>Помощник</button><button data-tab="profile"><i>○</i>Елена</button>
</nav>
<script>
const view=document.getElementById('view');let tab='home',mood='',chat=[['assistant','Здравствуйте. Я демонстрационный помощник пространства Елены. Могу предложить бережное упражнение или помочь сформулировать, что сейчас вас тревожит.']];
const practices=[['Вернуться в настоящий момент','Когда много тревожных мыслей','3 минуты','Заметьте пять предметов вокруг, четыре звука или ощущения и три спокойных выдоха. Не нужно ничего менять — просто побудьте здесь.'],['Дать чувствам место','Когда эмоции переполняют','5 минут','Назовите чувство, которое сейчас заметнее всего. Где оно ощущается? Что оно может пытаться вам сообщить?'],['Найти внутреннюю опору','Когда нужна уверенность','7 минут','Вспомните ситуацию, с которой вы уже справились. Что тогда помогло? Какие качества вы можете взять с собой сегодня?'],['Мягкие личные границы','Когда трудно сказать «нет»','8 минут','Подумайте, что для вас приемлемо, а что хотелось бы изменить. Попробуйте сформулировать одну спокойную фразу о своей границе.']];
function home(){return `<section class="hero"><img src="./images/elena-osintseva.jpg" alt="Елена Осинцева"><div class="shade"></div><div class="heroText"><span class="eyebrow">ПРОСТРАНСТВО ЗАБОТЫ О СЕБЕ</span><h1>Можно быть<br><em>собой.</em></h1><p>Место, где можно остановиться, услышать себя и найти внутреннюю опору.</p><button class="btn" onclick="go('chat')">♡ Мне нужна поддержка</button></div></section><div class="sectionHead"><div><span class="eyebrow">ВАШ МАЛЕНЬКИЙ ШАГ</span><h2>С чего начнём сегодня?</h2></div><small>${new Date().toLocaleDateString('ru-RU',{day:'numeric',month:'long'})}</small></div><div class="grid">
<button class="tile" onclick="go('chat')"><span class="ico">♡</span><b>Поддержка сейчас</b><small>Когда тревожно, грустно или сложно</small></button>
<button class="tile" onclick="go('practices')"><span class="ico">❀</span><b>Практики и упражнения</b><small>Дыхание, ресурс, эмоции, самооценка</small></button>
<button class="tile" onclick="go('journal')"><span class="ico">▤</span><b>Дневник чувств</b><small>Замечать и отслеживать изменения</small></button>
<button class="tile" onclick="go('profile')"><span class="ico">▦</span><b>Запись к Елене</b><small>Консультации и форматы работы</small></button>
<button class="tile" onclick="go('journal')"><span class="ico">♧</span><b>Мой путь</b><small>Цели, привычки и личные достижения</small></button>
<button class="tile" onclick="go('chat')"><span class="ico">✧</span><b>ИИ-помощник</b><small>Бережный диалог и подсказки</small></button>
</div><div class="quote"><p>«Не обязательно иметь все ответы прямо сейчас. Иногда достаточно сделать один бережный шаг».</p><small>Пространство Елены Осинцевой</small></div><button class="banner" onclick="go('profile')"><b>Хотите поговорить с Еленой?</b><small>Выберите удобный способ связи</small></button>`}
function pageHead(title,desc){return `<button class="back" onclick="go('home')">← На главную</button><span class="eyebrow">БЕРЕЖНО К СЕБЕ</span><h1>${title}</h1><p class="intro">${desc}</p>`}
function practicesPage(){return pageHead('Практики<br><em>для себя</em>','Выберите то, что сейчас откликается. Можно идти в своём темпе и остановиться в любой момент.')+practices.map((p,i)=>`<button class="card practice" onclick="practice(${i})"><span style="font-size:22px">❀</span><span><strong>${p[0]}</strong><small>${p[1]} · ${p[2]}</small></span>›</button>`).join('')}
function journalPage(){let entries=JSON.parse(localStorage.getItem('elena-journal')||'[]');return pageHead('Дневник<br><em>чувств</em>','Здесь не нужно быть правильным. Можно честно отметить то, что происходит внутри.')+`<div class="card"><b style="font-size:12px">Как вы себя чувствуете сегодня?</b><div class="moods">${['тяжело','не очень','нормально','хорошо','прекрасно'].map((m,i)=>`<button class="${mood===m?'sel':''}" onclick="pickMood('${m}')">${['☹','◔','○','☺','♡'][i]}<br>${m}</button>`).join('')}</div><b style="font-size:12px">Что хотелось бы записать?</b><textarea id="note" placeholder="Мысли, чувства, события или несколько слов о себе…"></textarea><button class="btn" style="width:100%;margin-top:12px" onclick="saveNote()">Сохранить запись</button><p class="muted">Записи демоверсии сохраняются локально на этом устройстве.</p></div><h3 style="font:20px 'Playfair Display'">Мои заметки</h3>${entries.reverse().map(e=>`<div class="card"><b>${e.mood}</b><p>${e.note||'Без дополнительной заметки'}</p><small class="muted">${new Date(e.date).toLocaleString('ru-RU')}</small></div>`).join('')||'<p class="muted">Пока здесь тихо. Первая запись появится, когда вы решите ею поделиться.</p>'}`}
function chatPage(){return pageHead('Рядом,<br><em>чтобы услышать</em>','Можно начать с любого вопроса. Вы сами решаете, чем делиться и когда остановиться.')+`<div class="card muted">Это демонстрационный помощник с заранее заданными ответами. Он не заменяет консультацию психолога и не предназначен для кризисной помощи.</div><div class="chatlog" id="chatlog">${chat.map(m=>`<div class="bubble ${m[0]==='user'?'user':''}">${escapeHtml(m[1])}</div>`).join('')}</div><div style="display:flex;gap:7px"><input id="chatinput" placeholder="Напишите, что сейчас важно…" onkeydown="if(event.key==='Enter')sendChat()"><button class="btn" onclick="sendChat()">➤</button></div><p class="muted">При непосредственной опасности обратитесь в местную экстренную службу или к человеку, который может помочь прямо сейчас.</p>`}
function profilePage(){return pageHead('Елена<br><em>Осинцева</em>','Психолог. Пространство бережного отношения к себе, понимания чувств и поиска собственных решений.')+`<div class="profile"><img src="./images/elena-osintseva.jpg" alt="Елена Осинцева"></div><div class="card"><h3>О консультациях</h3><p>Здесь разместим согласованную с Еленой информацию о её подходе, направлениях работы и форматах консультаций.</p><p class="muted">Контакты мессенджеров подключим после получения ссылок Елены.</p></div><div class="card links"><h3>Связаться с Еленой</h3><p class="muted">Ссылки пока не настроены.</p><button disabled>MAX — скоро</button><button disabled>Telegram — скоро</button><button disabled>WhatsApp — скоро</button></div>`}
function render(){view.innerHTML=tab==='home'?home():tab==='practices'?practicesPage():tab==='journal'?journalPage():tab==='chat'?chatPage():profilePage();document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab))}
function go(t){tab=t;render();window.scrollTo(0,0)}
document.querySelectorAll('.nav button').forEach(b=>b.addEventListener('click',()=>go(b.dataset.tab)));
function practice(i){const p=practices[i];view.innerHTML=pageHead(p[0],p[1]+' · '+p[2])+`<div class="card"><p>${p[3]}</p><p>Устройтесь поудобнее. Сделайте спокойный вдох и мягкий выдох. Не нужно добиваться особого состояния — просто побудьте рядом с собой несколько минут.</p><button class="btn" onclick="go('practices')">Я попробую</button></div>`}
function pickMood(m){mood=m;render()}
function saveNote(){if(!mood){alert('Сначала выберите настроение.');return}let a=JSON.parse(localStorage.getItem('elena-journal')||'[]');a.push({mood,note:document.getElementById('note').value,date:new Date().toISOString()});localStorage.setItem('elena-journal',JSON.stringify(a));mood='';render()}
function sendChat(){let el=document.getElementById('chatinput'),v=el.value.trim();if(!v)return;chat.push(['user',v],['assistant','Спасибо, что поделились. Давайте не будем торопиться с выводами. Что сейчас для вас самое важное в этой ситуации? Я могу предложить короткую практику. Помните: этот демонстрационный помощник не заменяет профессиональную психологическую помощь.']);render()}
function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
render();
if('serviceWorker'in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))}
</script></body></html>
